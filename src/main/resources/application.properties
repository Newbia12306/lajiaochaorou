server.port=8081
spring.application.name=menu-service
server.address=0.0.0.0

# Static resources
spring.web.resources.static-locations=classpath:/webapp/,classpath:/static/,classpath:/public/
spring.mvc.static-path-pattern=/**

# View settings
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html

# Logging
logging.level.com.example.demo=DEBUG


spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.drop-first=false

# JPA ???????
spring.jpa.hibernate.ddl-auto=validate

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

spring.elasticsearch.uris=https://localhost:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=123456

spring.datasource.url=jdbc:postgresql://localhost:5432/demo1
spring.datasource.username=postgres
spring.datasource.password=123456

# LLM Configuration (DeepSeek or other OpenAI-compatible APIs)
# DeepSeek API example:
llm.api.base-url=https://api.deepseek.com/v1
llm.api.key=${DEEPSEEK_API_KEY}
llm.chat-model=deepseek-chat
llm.embedding-model=text-embedding-ada-002

# Or use local model for testing (no API key needed)
llm.use-local=false

# JWT secret key (fixed, so tokens survive restarts)
jwt.secret=demo-menu-service-jwt-secret-key-2026
