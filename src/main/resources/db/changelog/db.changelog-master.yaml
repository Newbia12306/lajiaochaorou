databaseChangeLog:
  - changeSet:
      id: 1
      author: you
      changes:
        - sql:
            sql: SELECT 1

  - changeSet:
      id: 2
      author: you
      changes:
        - sql:
            sql: |
              CREATE EXTENSION IF NOT EXISTS vector;
              ALTER TABLE menu ADD COLUMN IF NOT EXISTS embedding vector(384);

  - changeSet:
      id: 3
      author: you
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS order_records (
                id BIGSERIAL PRIMARY KEY,
                user_id VARCHAR(255) NOT NULL REFERENCES users(id),
                dish_id INTEGER NOT NULL REFERENCES menu(id),
                order_id VARCHAR(255) NOT NULL,
                quantity INTEGER NOT NULL DEFAULT 1,
                ordered_at TIMESTAMP NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_order_records_user_id ON order_records(user_id);
              CREATE INDEX IF NOT EXISTS idx_order_records_order_id ON order_records(order_id);
              CREATE INDEX IF NOT EXISTS idx_order_records_ordered_at ON order_records(ordered_at);
